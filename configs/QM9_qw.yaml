project_name: &_project_name !ENV "${LOGNAME}_topbf"
exp_name: !SUB "${exp_name}_QM9"
debug: !SUB ${debug}
test: !SUB ${test}
no_wandb: !SUB ${no_wandb}
logging_level: !SUB ${logging_level:-warning}

#data
dataset: 
  name: "QM9"
  datadir: !ENV "../dataset"
  num_workers: 4
  n_atom_types: &_n_atom_types 5
  # atom_decoder: ['H', 'C', 'N', 'O', 'F']
  # atomic_nb: [1, 6, 7, 8, 9]
  n_node_histogram: [0, 0, 5, 9, 31, 127, 605, 3127, 17760, 107982]
  remove_h: True
  normalizer_dict: 
    # pos: 2.0
    # one_hot: 1.0
    # charges: 9.0
  # colors_dic: ['#FFFFFF99', 'C7', 'C0', 'C3', 'C1']
  # radius_dic: [0.46, 0.77, 0.77, 0.77, 0.77]

  small_data: False
  small_model: 0
  data_size: 1

#model
dynamics:
  name: "GraphTransformer"
  in_node_nf: 128
  hidden_nf: 64
  n_layers: 8
  n_head: 8
  dim_ffX: 256
  dim_ffE: 256
  dim_ffy: 128
  adj_scale: 1
  sigma1_X: !SUB ${sigma1_X:-0.15}
  sigma1_A: !SUB ${sigma1_A:-0.15}
  beta1: !SUB ${beta1:-2.0}
  sample_steps: !SUB ${sample_steps:-1000}
  no_diff_coord: !SUB ${no_diff_coord:-False}
  charge_discretised_loss: !SUB ${charge_discretised_loss:-True}
  charge_clamp: !SUB ${charge_clamp:-True}
  t_min: !SUB ${t_min:-0.0001}

  eps_prob:           !SUB ${eps_prob:-1e-12}
  mask_diag_edges:    !SUB ${mask_diag_edges:-True}

  # ---------------- QW (optional) ----------------
  # QW-style Sinkhorn OT regularizer (training only)
  use_qw_loss:   !SUB ${use_qw_loss:-True}
  qw_weight:     !SUB ${qw_weight:-0.1}
  qw_eps:        !SUB ${qw_eps:-0.2}
  qw_iters:      !SUB ${qw_iters:-30}
  qw_on_edges:   !SUB ${qw_on_edges:-True}   # if True, also regularize bond-type probs

  # num_layers: 6
  


optimization:
  optimizer: "AdamW"
  batch_size: &_bsize !SUB ${batch_size:-64}
  # batch_size: 16
  lr: !SUB ${lr:-0.0001}
  epochs: !SUB ${epochs}
  difftime: !SUB ${difftime:-True}
  weight_decay: !SUB ${weight_decay:-1e-12}
  resume: !SUB ${resume:-False}
  recover_trigger_loss: !SUB ${recover_trigger_loss:-500}
  skip_count_limit: !SUB ${skip_count_limit:-3}
  maximum_allowed_norm: !SUB ${maximum_allowed_norm:-10000}

evaluation:
  eval_data_num: !SUB ${eval_data_num:-1000}
  batch_size: *_bsize
  single_bond: False


accounting:
  logdir: &_logdir !PATHJOIN ["./logs/", *_project_name, !SUB "${exp_name}_QM9"]
  wandb_logdir: *_logdir
  dump_config_path: !PATHJOIN [*_logdir, "config.yaml"]
  checkpoint_dir: &_checkpoint_dir !PATHJOIN [*_logdir, "checkpoints"]
  ckpt_pattern: &_ckpt_pattern !SUB "${ckpt_pattern}"
  checkpoint_path: !PATHJOIN [*_checkpoint_dir, *_ckpt_pattern]
  generated_mol_dir: !PATHJOIN [*_logdir, "generated_mol"]
  checkpoint_freq: !SUB ${checkpoint_freq:-20}
  exp_version: !SUB ${exp_version:-None}

#visualization
visual:
  save_mols: True
  visual_nums: 10
  visual_chain: True








